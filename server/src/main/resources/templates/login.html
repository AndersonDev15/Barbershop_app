<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | BarberOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .glow-top {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: rgba(242, 202, 80, 0.05);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-bottom {
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: rgba(61, 225, 252, 0.05);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 448px;
        }

        .card {
            background: #201f1f;
            border-radius: 1rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 2rem;
        }

        @media (min-width: 480px) {
            .card { padding: 3rem; }
        }

        .brand {
            text-align: center;
            margin-bottom: 2.5rem;
            margin-top: 0.5rem;
        }
        .brand-name {
            font-family: 'Manrope', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #f2ca50;
            letter-spacing: -0.03em;
            display: block;
            margin-bottom: 0.75rem;
        }
        .brand h1 {
            font-family: 'Manrope', sans-serif;
            font-size: 1.375rem;
            font-weight: 700;
            color: #e5e2e1;
            letter-spacing: -0.02em;
            margin-bottom: 0.375rem;
        }
        .brand p {
            font-size: 0.875rem;
            color: #d0c5af;
            opacity: 0.8;
        }

        .error-box {
            width: 100%;
            background: rgba(147, 0, 10, 0.15);
            border: 1px solid rgba(255, 180, 171, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin-bottom: 1.5rem;
        }
        .error-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #ffb4ab;
        }
        .error-box span {
            font-size: 0.8125rem;
            color: #ffb4ab;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.25rem;
        }

        label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #e5e2e1;
        }

        .forgot-link {
            font-size: 0.75rem;
            color: #f2ca50;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #353534;
            border: none;
            outline: none;
            color: #e5e2e1;
            border-radius: 9999px;
            padding: 1rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            transition: box-shadow 0.2s;
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(208, 197, 175, 0.5);
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            box-shadow: 0 0 0 2px rgba(242, 202, 80, 0.3);
        }

        .btn-primary {
            width: 100%;
            background: #f2ca50;
            color: #3c2f00;
            border: none;
            border-radius: 9999px;
            padding: 1rem;
            font-family: 'Manrope', sans-serif;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.75rem;
            box-shadow: 0 8px 16px rgba(242, 202, 80, 0.15);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover { background: #d4af37; }
        .btn-primary:active { transform: scale(0.98); }

        .register-text {
            width: 100%;
            text-align: center;
            font-size: 0.8125rem;
            color: #d0c5af;
            margin-top: 1.75rem;
        }
        .register-text a {
            color: #f2ca50;
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.25rem;
        }
        .register-text a:hover { text-decoration: underline; }

        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.75rem 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(77, 70, 53, 0.4);
        }
        .divider-text {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(208, 197, 175, 0.5);
        }

        .google-form { width: 100%; }
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: #353534;
            border: 1px solid rgba(77, 70, 53, 0.3);
            border-radius: 9999px;
            padding: 1rem;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-google:hover { background: #3a3939; }
        .btn-google:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="glow-top"></div>
<div class="glow-bottom"></div>

<main>
    <div class="card">

        <!-- Brand -->
        <div class="brand">
            <span class="brand-name">BarberOS</span>
            <h1>Welcome Back</h1>
            <p>Log in to manage your barbershop</p>
        </div>

        <!-- Error -->
        <div th:if="${param.error}" class="error-box">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Invalid username or password</span>
        </div>

        <!-- Login form -->
        <form method="post" th:action="@{/login}" class="login-form">
            <div class="field">
                <label for="username">Email</label>
                <div class="input-wrapper">
                    <input id="username" type="text" name="username" placeholder="Enter your email" required/>
                </div>
            </div>

            <div class="field">
                <div class="field-header">
                    <label for="password">Password</label>
                    <a href="http://127.0.0.1:5173/forgot-password" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <input id="password" type="password" name="password" placeholder="Enter your password" required/>
                </div>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <!-- Register link -->
        <p class="register-text">
            Don't have an account?
            <a href="http://127.0.0.1:5173/register">Create one here</a>
        </p>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or</span>
            <div class="divider-line"></div>
        </div>

        <!-- Google OAuth2 -->
        <form method="get" th:action="@{/oauth2/authorization/google}" class="google-form">
            <button type="submit" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 5.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </form>

    </div>
</main>

</body>
</html>
