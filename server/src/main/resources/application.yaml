server:
  port: 9000
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:http://127.0.0.1:9000}
  frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5173}
  redirect-uri: ${APP_REDIRECT_URI:http://127.0.0.1:8090/login/oauth2/code/barberia-client}
  bff-url: ${APP_BFF_URL:http://127.0.0.1:8090}

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: NEVER



  security:
    oau<th2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com

  application:
    name: authServer

# APIs internas
internal:
  api:
    keys:
      barberia-api: ${BARBERIA_API_KEY:dev-barberia-key-12345}

# Business API
business:
  api:
    url: ${BUSINESS_API_URL:http://127.0.0.1:8080}
    api-key: ${AUTH_SERVER_API_KEY:dev-auth-server-key-67890}

# SendGrid
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL}
  from-name: Barbería App

# Feign
feign:
  client:
    config:
      business-api:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic

# Job de reconciliación
reconciliation:
  enabled: true
  batch-size: 100

logging:
  level:
    org.springframework.security: DEBUG
    com.auth.server: DEBUG
    org.springframework.security.oauth2: TRACE