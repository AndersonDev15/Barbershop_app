spring.config.import=optional:file:.env[.properties]

spring.application.name=barbershop_app
app.backend-url=http://localhost:8080

# base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# spring jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# jwt
jwt.secret=${JWT_SECRET}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# auth server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://127.0.0.1:9000/oauth2/jwks}
auth.server.url=${AUTH_SERVER_URL:http://127.0.0.1:9000}

auth.server.api-key=${BARBERIA_API_KEY:dev-barberia-key-12345}

internal.api.keys.auth-server=${AUTH_SERVER_API_KEY:dev-auth-server-key-67890}

# feign
feign.client.config.auth-client.connectTimeout=5000
feign.client.config.auth-client.readTimeout=10000
feign.client.config.auth-client.loggerLevel=basic

# email
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM_EMAIL}

# cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}